claim_boundaries:
  label_isolation: Ground-truth labels may be read only to verify frozen source reconstruction, then are discarded; they are not passed to model inference and are absent from prediction rows.
  binary_probability: Yes/No confidence is normalized only across the two pinned answer-token logits; full-vocabulary Yes+No mass is reported separately.
  expressed_confidence: The exact generated continuation is persisted and parsed without repair, search, fallback, or imputation.
  evidence_conditions: Conditions are deterministic categorical stress tests and are not claimed to form an ordered severity scale.
  scope: Frozen base-model inference only; no calibration, fine-tuning, accuracy, or uncertainty-performance claim.
