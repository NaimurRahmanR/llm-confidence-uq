claim_boundaries:
  label_isolation: Ground-truth labels are unavailable to model inference and absent from prediction rows.
  adapter_identity: Every prediction is bound to one adapter stage, training seed, checkpoint ledger, weight digest and semantic configuration digest.
  binary_probability: Yes/No confidence is normalized only across the two pinned answer-token logits; full-vocabulary mass is recorded separately.
  expressed_confidence: Generated confidence is parsed exactly without repair, fallback or imputation.
  scope: Independent LoRA-adapter predictions only; no calibration, aggregation, accuracy or ensemble-performance claim.
