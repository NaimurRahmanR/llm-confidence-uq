claim_boundaries:
  supervision: Only the ground-truth Yes/No answer token is supervised; no numerical confidence target is invented.
  data_isolation: Only the frozen 800-example training split is used for optimization; calibration and test labels are excluded.
  scope: Parameter-efficient LoRA adaptation of a frozen base model; this is not full-model fine-tuning.
  reproducibility: Seeds and deterministic kernels limit variability within the pinned environment but do not guarantee cross-platform bitwise identity.
