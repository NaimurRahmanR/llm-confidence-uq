objective:
  name: full-vocabulary-next-token-cross-entropy
  prompt_loss_weight: 0.0
  answer_tokens_per_example: 1
  numerical_confidence_targets_used: false
  class_order: ["Yes", "No"]
  class_continuations: {"Yes": " Yes", "No": " No"}
  class_token_ids: {"Yes": 7414, "No": 2308}
  maximum_prompt_tokens: 768
  padding_side: left
  truncation_allowed: false
  logits_to_keep: 1
  attention_derived_position_ids: true

lora:
  task_type: CAUSAL_LM
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: none
  initialization: default
  use_rslora: false
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  expected_target_module_instances: 196
  expected_trainable_parameter_count: 9232384
  expected_total_parameter_count_with_adapter: 1552946688

optimization:
  implementation: torch-explicit-loop-v1
  trainer_abstraction_used: false
  optimizer: torch.optim.AdamW
  learning_rate: 0.0002
  betas: [0.9, 0.999]
  epsilon: 0.00000001
  weight_decay: 0.01
  batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32
  maximum_gradient_norm: 1.0
  scheduler: linear-warmup-cosine-decay-v1
  full_epochs: 3
  full_warmup_steps: 8
  full_optimizer_steps: 75
  num_workers: 0
  pin_memory: true
  use_cache: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  allow_tf32: false

stages:
  smoke32:
    seed: 20260811
    examples: 32
    epochs: 1
    warmup_steps: 0
    optimizer_steps: 1
  full_seed_1:
    seed: 20260811
    examples: 800
    epochs: 3
    warmup_steps: 8
    optimizer_steps: 75
  full_seed_2:
    seed: 20260812
    examples: 800
    epochs: 3
    warmup_steps: 8
    optimizer_steps: 75
  full_seed_3:
    seed: 20260813
    examples: 800
    epochs: 3
    warmup_steps: 8
    optimizer_steps: 75

checkpoint:
  root: outputs/checkpoints/lora
  run_manifest_root: outputs/manifests/lora
  adapter_safe_serialization: true
  save_embedding_layers: false
  save_optimizer_state: true
  atomic_directory_publish: true
  refuse_differing_existing_artifacts: true
  publish_completion_marker_last: true
  reload_validation: true
  reload_logit_atol: 0.00001
  reload_logit_rtol: 0.0
  persist_raw_prompt: false
  persist_question: false
  persist_passage: false

