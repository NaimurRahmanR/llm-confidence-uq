[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-confidence-uq"
version = "0.1.0"
description = "Confidence and uncertainty analysis under evidence degradation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "NaimurRahmanR"}]
dependencies = [
    "accelerate==1.14.0",
    "datasets==4.0.0",
    "huggingface-hub==1.23.0",
    "matplotlib==3.10.0",
    "numpy==2.0.2",
    "pandas==2.2.2",
    "peft==0.19.1",
    "PyYAML==6.0.3",
    "safetensors==0.8.0",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "torch==2.11.0",
    "transformers==5.13.1",
]

[project.urls]
Repository = "https://github.com/NaimurRahmanR/llm-confidence-uq"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
