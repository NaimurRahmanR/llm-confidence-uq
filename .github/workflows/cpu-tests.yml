name: CPU unit and contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0"
          python -m pip install -r requirements-ci.txt
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild statistical artifacts in a clean temporary directory
        run: |
          python scripts/build_statistical_analysis.py --config configs/statistical_analysis.yaml --preflight
